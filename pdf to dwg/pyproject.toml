[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2dxf"
version = "0.1.0"
description = "Konwerter wektorowych rysunków PDF do DXF (opcjonalnie DWG)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PyMuPDF 2.x wymaga onnxruntime (brak kół dla nowszych Pythonów);
    # struktury danych sprawdzone na 1.28.x — patrz README, "Decyzje projektowe".
    "pymupdf>=1.24,<2",
    "ezdxf>=1.3",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.7"]
gui = ["tkinterdnd2>=0.4"]
build = ["pyinstaller>=6", "tkinterdnd2>=0.4", "pillow"]
dev = [
    "pytest>=8",
    "pymupdf-fonts>=1.0",
    "matplotlib>=3.7",
    "tkinterdnd2>=0.4",
]

[project.scripts]
pdf2dxf = "pdf2dxf.cli:main"

[project.gui-scripts]
pdf2dxf-gui = "pdf2dxf.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: wolne testy (np. wizualne porównanie rastrów)",
]
filterwarnings = [
    # ostrzeżenie z wnętrza PyMuPDF 1.28 na Pythonie 3.15
    "ignore:'typing.ByteString':DeprecationWarning",
]
